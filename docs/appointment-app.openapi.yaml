openapi: 3.0.3
info:
  title: Appointment app HTTP API
  version: "1.0.0"
  description: |
    Full HTTP surface of the Flask app in `app.py`. Routes are registered
    on the Flask `app` object (no separate blueprints). `strict_slashes`
    is false, so trailing slashes are accepted.

    **Do not invent extra paths.** This document matches the handlers in
    `app.py` plus the billing implementations in `billing/routes.py`.

    Auth when `VAPI_SECRET` is set (`_unauthorized_if_needed`): header
    `x-vapi-secret` (or `X-Vapi-Secret`) equal to the secret, **or**
    `Authorization` equal to the secret, **or** `Authorization: Bearer {secret}`.
    If `VAPI_SECRET` is unset, those checks are skipped (except
    `/conversations/purge`, which always requires a secret).

    Vapi tool POSTs accept either a Vapi tool-call envelope
    (`message.toolCalls[0].function.arguments`) or the same fields on the
    JSON root. Scheduler mutations also accept a list under `events`,
    `appointments`, or `items` (max 20).

    CORS (`Access-Control-Allow-Origin: *`) is added on every response.
    Allowed methods: GET, POST, PUT, PATCH, HEAD, OPTIONS.
    Allowed headers: Content-Type, Authorization, x-vapi-secret.

    Billing HTML pages always return **HTTP 200**. See tag Billing.
servers:
  - url: /
    description: Same origin as the Flask app
  - url: https://{host}
    description: Public Cloud Run (or other) base URL
    variables:
      host:
        default: appointment-app-43062247540.europe-west1.run.app
        description: Hostname only; set from VAPI_SERVER_BASE_URL in deployment
tags:
  - name: Vapi
    description: |
      Voice assistant server URL (`/vapi-init`) and tool webhooks
      (`/book`, `/cancel`, `/reschedule`, `/slots`, `/appointments`, `/events`).
  - name: Slots
    description: Direct availability lookup (not the Vapi tool webhook)
  - name: WhatsApp
    description: Meta Cloud API verification (GET) and inbound webhook (POST)
  - name: Billing
    description: CreditGuard card-token enrollment (subset also in billing.openapi.yaml)
  - name: Conversations
    description: Retention purge of conversation_logs (not a public CRUD API)

paths:
  /api/v1/slots:
    get:
      tags: [Slots]
      operationId: getSlots
      summary: List available slots for a date
      description: |
        Direct GET availability. **No** `x-vapi-secret` check.
        Query `business_code`, `date`, and `duration` are all required.
        Optional `strict=true` enables strict mode in `check_availability`.
        Example from the handler docstring:
        `/api/v1/slots?business_code=RUTH_LEV&date=2026-07-20&duration=45&strict=true`
      parameters:
        - name: business_code
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: true
          description: Date string passed through to `check_availability`
          schema:
            type: string
            example: "2026-07-20"
        - name: duration
          in: query
          required: true
          description: Duration in minutes (parsed as int)
          schema:
            type: integer
            example: 45
        - name: strict
          in: query
          required: false
          description: Compared case-insensitively to the string `true`
          schema:
            type: string
            default: "false"
      responses:
        "200":
          description: Availability payload
          content:
            application/json:
              schema:
                type: object
                required: [business_code, date, available_slots]
                properties:
                  business_code:
                    type: string
                  date:
                    type: string
                  available_slots: {}
        "400":
          description: Missing business_code, date, or duration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Missing required parameters
        "500":
          description: Exception from `check_availability`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /book:
    post:
      tags: [Vapi]
      operationId: vapiBook
      summary: Vapi tool — book appointment(s)
      description: |
        Vapi server URL for `scheduler_book_appointment` (`tool_schemas.py` → `/book`).
        Default action is `book`. Required per event (unless supplied via a
        batch list): `business_code`, `client_phone`, `service_id`,
        `duration`, `price`, `appointment_time`. Optional `client_name`,
        `force_booking`.

        Success for the Vapi envelope is HTTP 200 when `success` or
        `action_required` is true; otherwise HTTP 500 with the same
        `results[]` shape. Missing required fields without a batch list
        return HTTP 400 `{success: false, error}`.
      security:
        - VapiSecret: []
        - VapiAuthorization: []
        - VapiBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VapiSchedulerRequest"
            examples:
              vapiToolCall:
                summary: Vapi toolCalls envelope
                value:
                  message:
                    toolCalls:
                      - id: "call_1"
                        function:
                          name: scheduler_book_appointment
                          arguments:
                            business_code: "example-business"
                            client_phone: "0501234567"
                            client_name: "דנה"
                            service_id: 1
                            duration: 45
                            price: 120
                            appointment_time: "2026-09-10T10:00:00"
                            force_booking: false
              flat:
                summary: Flat JSON (also accepted)
                value:
                  business_code: "example-business"
                  client_phone: "0501234567"
                  service_id: 1
                  duration: 45
                  price: 120
                  appointment_time: "2026-09-10T10:00:00"
      responses:
        "200":
          description: Vapi tool result (booking succeeded or action_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapiToolResults"
        "400":
          description: Missing required fields / too many events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Scheduler returned unsuccessful result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapiToolResults"

  /cancel:
    post:
      tags: [Vapi]
      operationId: vapiCancel
      summary: Vapi tool — cancel appointment(s)
      description: |
        Vapi server URL for `scheduler_cancel_appointment` → `/cancel`.
        Default action is `cancel`. Required: `business_code`, `client_phone`.
        Optional `appointment_time` (required in product terms when the
        client has several active appointments).

        `_mutation_response(..., ok_on_user_message=True)`: HTTP 200 if
        `success`, `action_required`, **or** `user_message` is set.
      security:
        - VapiSecret: []
        - VapiAuthorization: []
        - VapiBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VapiSchedulerRequest"
      responses:
        "200":
          description: Vapi tool result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapiToolResults"
        "400":
          description: Missing required fields / too many events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Unsuccessful cancel without user_message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapiToolResults"

  /reschedule:
    post:
      tags: [Vapi]
      operationId: vapiReschedule
      summary: Vapi tool — move appointment, or suggest slots
      description: |
        Vapi server URL for `scheduler_move_appointment` → `/reschedule`.
        If there is **no** events list **and** `new_appointment_time` is
        missing: requires `business_code`, `client_phone`, `service_id`;
        then calls `get_suggested_slots` (date defaults to Israel today)
        and always returns HTTP 200 Vapi results.

        Otherwise default action is `reschedule`. Required:
        `business_code`, `client_phone`, `service_id`, `new_appointment_time`.
        Optional `current_appointment_time`, `force_booking`.
        Missing `new_appointment_time` after the suggest-slots branch
        yields a Hebrew `user_message` (not `_bad_request`).
        Uses `ok_on_user_message=True` for the mutation path.
      security:
        - VapiSecret: []
        - VapiAuthorization: []
        - VapiBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VapiSchedulerRequest"
      responses:
        "200":
          description: Slot suggestions or reschedule Vapi result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapiToolResults"
        "400":
          description: Missing fields for suggest-slots or mutation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Unsuccessful mutation without user_message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapiToolResults"

  /events:
    post:
      tags: [Vapi]
      operationId: vapiEvents
      summary: Batch book / cancel / reschedule
      description: |
        Runs `_run_scheduler_events`. Requires either a list under
        `events` / `appointments` / `items`, or a top-level `action`.
        Per-item `action` (or `type`) maps:
        book/create/schedule/add → book;
        cancel/delete/remove → cancel;
        reschedule/move/update/shift → reschedule.

        If the request looks like a Vapi tool call (`toolCall.id` or
        `message.toolCalls`), response is the Vapi `results[]` envelope
        (`ok_on_user_message=True`). Otherwise JSON
        `{success, user_message, items, error}` with HTTP 200 when
        success, action_required, or user_message; else HTTP 400.
      security:
        - VapiSecret: []
        - VapiAuthorization: []
        - VapiBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VapiSchedulerRequest"
            example:
              business_code: "example-business"
              client_phone: "0501234567"
              events:
                - action: book
                  service_id: 1
                  duration: 45
                  price: 120
                  appointment_time: "2026-09-10T10:00:00"
                - action: cancel
                  appointment_time: "2026-09-11T11:00:00"
      responses:
        "200":
          description: Vapi envelope or direct JSON success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VapiToolResults"
                  - $ref: "#/components/schemas/EventsDirectResponse"
        "400":
          description: Missing events/action, validation, or failed direct response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SchedulerError"
                  - $ref: "#/components/schemas/EventsDirectResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Vapi envelope for unsuccessful mutation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapiToolResults"

  /slots:
    post:
      tags: [Vapi]
      operationId: vapiSuggestSlots
      summary: Vapi tool — suggested slots
      description: |
        Vapi server URL for `scheduler_get_slots` → `/slots`.
        Required `business_code`. Optional `date` (YYYY-MM-DD),
        `service_id`, `duration`. Empty date is treated as None
        (system suggests nearby days). Always HTTP 200 Vapi results
        when authorized and `business_code` is present.
      security:
        - VapiSecret: []
        - VapiAuthorization: []
        - VapiBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VapiSchedulerRequest"
      responses:
        "200":
          description: Suggested slots as Vapi tool result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapiToolResults"
        "400":
          description: Missing business_code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /appointments:
    post:
      tags: [Vapi]
      operationId: vapiListAppointments
      summary: Vapi tool — list client appointments
      description: |
        Vapi server URL for `scheduler_list_appointments` → `/appointments`.
        Required `business_code`, `client_phone`. Optional
        `appointment_date` (YYYY-MM-DD), `service_id`.
        HTTP 200 if `success` or `user_message`; else HTTP 500 Vapi envelope.
      security:
        - VapiSecret: []
        - VapiAuthorization: []
        - VapiBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VapiSchedulerRequest"
      responses:
        "200":
          description: List result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapiToolResults"
        "400":
          description: Missing business_code or client_phone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: List failed without user_message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapiToolResults"

  /vapi-init:
    options:
      tags: [Vapi]
      operationId: vapiInitOptions
      summary: CORS preflight
      description: Returns empty body HTTP 200. No auth.
      responses:
        "200":
          description: Empty body
          content:
            text/plain:
              schema:
                type: string
    head:
      tags: [Vapi]
      operationId: vapiInitHead
      summary: Health-style probe
      description: Same JSON as GET. No auth.
      responses:
        "200":
          description: Endpoint alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapiInitProbe"
    get:
      tags: [Vapi]
      operationId: vapiInitGet
      summary: Probe that vapi-init is mounted
      description: |
        Returns `{"status":"ok","endpoint":"vapi-init"}`. No secret check.
        Additional Flask routes (same handler): `/vapi-init/<path:rest>`,
        `/<path:prefix>/vapi-init`, `/<path:prefix>/vapi-init/<path:rest>`.
        The 404 handler also forwards paths that are `/vapi-init`, end
        with `/vapi-init`, or contain `/vapi-init/`.
      responses:
        "200":
          description: Probe JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapiInitProbe"
              example:
                status: ok
                endpoint: vapi-init
    post:
      tags: [Vapi]
      operationId: vapiInitPost
      summary: Vapi server URL — assistant-request and end-of-call-report
      description: |
        Reads JSON `message.type`.

        - `end-of-call-report`: requires Vapi auth if `VAPI_SECRET` is set;
          persists via `record_vapi_report`; `{"status":"ok"}` or 500
          `{"status":"error"}`.
        - `assistant-request`: requires Vapi auth if set; returns
          `assistantId` + `assistantOverrides` (model tools, firstMessage,
          variableValues, artifactPlan, serverMessages).
        - any other type: HTTP 200 `{"status":"ignored","reason":"not an assistant-request"}`
          **without** auth.
        PUT and PATCH use this same handler as POST.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VapiServerMessage"
            examples:
              assistantRequest:
                summary: assistant-request
                value:
                  message:
                    type: assistant-request
                    call:
                      customer:
                        number: "+972501234567"
              endOfCall:
                summary: end-of-call-report
                value:
                  message:
                    type: end-of-call-report
                    call:
                      customer:
                        number: "+972501234567"
      responses:
        "200":
          description: Assistant overrides, ok, or ignored
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VapiInitProbe"
                  - $ref: "#/components/schemas/VapiIgnored"
                  - $ref: "#/components/schemas/VapiAssistantResponse"
                  - type: object
                    properties:
                      status:
                        type: string
                        enum: [ok]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: end-of-call-report persist failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [error]
    put:
      tags: [Vapi]
      operationId: vapiInitPut
      summary: Same handler as POST
      description: Flask allows PUT on vapi-init; body handling matches POST.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VapiServerMessage"
      responses:
        "200":
          description: Same as POST
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: end-of-call-report persist failed
    patch:
      tags: [Vapi]
      operationId: vapiInitPatch
      summary: Same handler as POST
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VapiServerMessage"
      responses:
        "200":
          description: Same as POST
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: end-of-call-report persist failed

  /vapi-init/{rest}:
    parameters:
      - name: rest
        in: path
        required: true
        description: Extra path after /vapi-init (Flask `<path:rest>`)
        schema:
          type: string
    get:
      tags: [Vapi]
      operationId: vapiInitRestGet
      summary: Alias of GET /vapi-init
      responses:
        "200":
          description: Probe JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapiInitProbe"
    options:
      tags: [Vapi]
      operationId: vapiInitRestOptions
      summary: Alias of OPTIONS /vapi-init
      responses:
        "200":
          description: Empty body
    head:
      tags: [Vapi]
      operationId: vapiInitRestHead
      summary: Alias of HEAD /vapi-init
      responses:
        "200":
          description: Same as GET
    post:
      tags: [Vapi]
      operationId: vapiInitRestPost
      summary: Alias of POST /vapi-init
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VapiServerMessage"
      responses:
        "200":
          description: Same as POST /vapi-init
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: end-of-call-report persist failed
    put:
      tags: [Vapi]
      operationId: vapiInitRestPut
      summary: Alias of PUT /vapi-init
      responses:
        "200":
          description: Same as POST /vapi-init
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Vapi]
      operationId: vapiInitRestPatch
      summary: Alias of PATCH /vapi-init
      responses:
        "200":
          description: Same as POST /vapi-init
        "401":
          $ref: "#/components/responses/Unauthorized"

  /{prefix}/vapi-init:
