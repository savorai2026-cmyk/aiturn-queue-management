      responses:
        "200":
          description: Probe JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapiInitProbe"
    options:
      tags: [Vapi]
      operationId: vapiInitPrefixedRestOptions
      summary: Alias of OPTIONS /vapi-init
      responses:
        "200":
