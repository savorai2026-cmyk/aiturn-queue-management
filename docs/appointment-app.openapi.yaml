      responses:
        "200":
          description: Same as POST /vapi-init
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Vapi]
      operationId: vapiInitPrefixedRestPatch
      summary: Alias of PATCH /vapi-init
      responses:
        "200":
          description: Same as POST /vapi-init
        "401":
          $ref: "#/components/responses/Unauthorized"

  /whatsapp/webhook:
    get:
      tags: [WhatsApp]
      operationId: whatsappVerify
      summary: Meta webhook verification
      description: |
        Meta Cloud API handshake. Succeeds when `hub.mode` is `subscribe`
        **and** `WHATSAPP_VERIFY_TOKEN` is non-empty **and**
        `hub.verify_token` equals that env value. Response body is
        `hub.challenge` (or empty string) with HTTP 200.
        Otherwise JSON `{"error":"forbidden"}` HTTP 403.
        No `x-vapi-secret`.
      parameters:
        - name: hub.mode
          in: query
          required: false
          schema:
            type: string
            enum: [subscribe]
        - name: hub.verify_token
          in: query
          required: false
          description: Must match env WHATSAPP_VERIFY_TOKEN
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Echo of hub.challenge
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: Token/mode mismatch or verify token unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: forbidden
    post:
      tags: [WhatsApp]
      operationId: whatsappInbound
      summary: Inbound WhatsApp webhook
      description: |
        No Vapi secret. If `WHATSAPP_PROVIDER` is unset / unknown /
        missing credentials, HTTP 503 `{"ok":false,"reason":"provider_not_configured"}`.

        JSON is parsed by the selected provider (`meta`/`cloud`/`facebook`
        or `greenapi`/`green-api`/`green`). Unparsed payloads return
        HTTP 200 `{"ok":true,"ignored":true}`. Parsed messages are handled
        asynchronously from the HTTP perspective; handler then
        `{"ok":true}` HTTP 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/MetaWhatsAppWebhook"
                - $ref: "#/components/schemas/GreenApiWhatsAppWebhook"
            examples:
              meta:
                summary: Meta Cloud API (parsed fields)
                value:
                  entry:
                    - changes:
                        - value:
                            messages:
                              - id: "wamid.example"
                                from: "972501234567"
                                type: text
                                text:
                                  body: "שלום"
              greenapi:
                summary: GreenAPI incomingMessageReceived
                value:
                  typeWebhook: incomingMessageReceived
                  idMessage: "true_972501234567@c.us_AAAA"
                  senderData:
                    chatId: "972501234567@c.us"
                    sender: "972501234567@c.us"
                  messageData:
                    typeMessage: textMessage
                    textMessageData:
                      textMessage: "שלום"
      responses:
        "200":
          description: Processed or ignored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppPostOk"
        "503":
          description: WHATSAPP_PROVIDER not configured
          content:
            application/json:
              schema:
                type: object
                required: [ok, reason]
                properties:
                  ok:
                    type: boolean
                    enum: [false]
                  reason:
                    type: string
                    enum: [provider_not_configured]

  /conversations/purge:
    post:
      tags: [Conversations]
      operationId: conversationsPurge
      summary: Flush WhatsApp sessions and purge expired logs
      description: |
        **Always** requires a secret: `CONVERSATIONS_PURGE_SECRET` if set,
        else `VAPI_SECRET`. Empty secret → 401. Header match is the same
        as Vapi tools (`x-vapi-secret` / `Authorization` / Bearer).

        Then flushes expired WhatsApp sessions for `BUSINESS_CODE` using
        `whatsapp_session_minutes() * 60`, then `purge_expired_logs`.
        No request body is read. Returns `{ok: true, detail, recording, metrics, held}`.
      security:
        - VapiSecret: []
        - VapiAuthorization: []
        - VapiBearer: []
      responses:
        "200":
          description: Purge stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationsPurgeResult"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /billing/health:
    get:
      tags: [Billing]
      operationId: billingHealth
      summary: CreditGuard / signing configuration probe
      description: |
        Returns whether CreditGuard terminal credentials and link secret
        are present. Does not expose secret values. `ok` is true only when
        user, password, terminal, and mid are all set
        (`config.is_terminal_configured()`). HTTP 200 when `ok` is true,
        HTTP 503 otherwise.
      responses:
        "200":
          description: Terminal credentials are configured (`ok` is true)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingHealth"
              example:
                ok: true
                terminal_configured: true
                user_configured: true
                mid_configured: true
                password_configured: true
                link_secret_configured: true
                relay_host: cguat2.creditguard.co.il
        "503":
          description: Terminal credentials incomplete (`ok` is false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingHealth"

  /billing/start:
    get:
      tags: [Billing]
      operationId: billingStart
      summary: Open a signed owner session and redirect to CreditGuard
      description: |
        **Not a public unauthenticated API.** HMAC-SHA256 over
        `{business_code}.{exp}` using `BILLING_LINK_SECRET` (fallback
        `VAPI_SECRET`). Links are generated server-side
        (`billing.links.build_start_url` or `python -m billing`).

        On success: persist `billing_sessions` + pending
        `payment_methods`, **302** to CreditGuard `mpiHostedPageUrl`.
        All failure paths return **HTML 200** (not 4xx). Session TTL
        after start is 3600 seconds.
      parameters:
        - $ref: "#/components/parameters/BusinessCode"
        - $ref: "#/components/parameters/Exp"
        - $ref: "#/components/parameters/Sig"
      responses:
        "302":
          description: Location is CreditGuard mpiHostedPageUrl
          headers:
            Location:
              description: CreditGuard mpiHostedPageUrl
              schema:
                type: string
                format: uri
        "200":
          description: |
            HTML error page (always status 200). Titles used in code:
            - קישור לא תקין — signature / exp / secret / params invalid
            - לא ניתן להתחיל — CreditGuard terminal not configured
            - שגיאה — business lookup or session persist failed
            - עסק לא נמצא — no `businesses` row for `business_code`
            - לא ניתן לפתוח את דף התשלום — CreditGuard Token setup failed
          content:
            text/html:
              schema:
                type: string

  /billing/callback:
    get:
      tags: [Billing]
      operationId: billingCallback
      summary: CreditGuard redirect after token page
      description: |
        Browser landing after hosted page success, error, or cancel.
        CreditGuard is given successUrl / errorUrl =
        `{public_base}/billing/callback` and cancelUrl =
        `{public_base}/billing/callback?outcome=cancel`.

        Required in practice: session `uniqueid` (aliases `uniqueID` /
        `uniqueId`). Does **not** trust CreditGuard query fields as truth:
        inquires the transaction server-side, then persists `cg_card_id` /
        last4. All responses are **HTML 200**.
      parameters:
        - name: uniqueid
          in: query
          required: false
          description: Session id (uuid hex). Missing yields HTML "חסר מזהה".
          schema:
            type: string
        - name: uniqueID
          in: query
          required: false
          description: Alias if uniqueid is empty
          schema:
            type: string
        - name: uniqueId
          in: query
          required: false
          description: Alias checked last
          schema:
            type: string
        - name: outcome
          in: query
          required: false
          description: `cancel` on the cancel URL (case-insensitive)
          schema:
            type: string
            enum: [cancel]
      responses:
        "200":
          description: |
            HTML result page. Titles used in code:
            - חסר מזהה — no uniqueid
            - סשן לא נמצא — no matching billing_sessions row
            - הכרטיס כבר שמור — session already succeeded
            - הסשן הסתיים — status already failed / canceled / expired
            - הקישור פג תוקף — expires_at in the past
            - שגיאה בשמירה — inquire ok but DB persist failed
            - הכרטיס נשמר — token stored
            - הפעולה בוטלה — cancel without card
            - לא נשמר כרטיס — inquire failed or no token
          content:
            text/html:
              schema:
                type: string

components:
  securitySchemes:
    VapiSecret:
      type: apiKey
      in: header
      name: x-vapi-secret
      description: Compared to VAPI_SECRET (or CONVERSATIONS_PURGE_SECRET on purge)
    VapiAuthorization:
      type: apiKey
      in: header
      name: Authorization
      description: Raw secret equal to VAPI_SECRET (no Bearer prefix)
    VapiBearer:
      type: http
      scheme: bearer
      description: Authorization Bearer {VAPI_SECRET}

  parameters:
    BusinessCode:
      name: business_code
      in: query
      required: true
      description: |
        `businesses.business_code`. Must match an existing row after
        signature verification. Part of the HMAC payload.
      schema:
        type: string
    Exp:
      name: exp
      in: query
      required: true
      description: |
        Unix timestamp (seconds). Must parse as int and be strictly
        greater than current `time.time()`. Part of the HMAC payload.
      schema:
        type: integer
        format: int64
    Sig:
      name: sig
      in: query
      required: true
      description: |
        HMAC-SHA256 hex digest of UTF-8 `{business_code}.{exp}`, keyed
        by BILLING_LINK_SECRET or VAPI_SECRET. Compared with
        hmac.compare_digest after lowercasing.
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{64}$"

  responses:
    Unauthorized:
      description: VAPI_SECRET (or purge secret) set and header did not match
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: Unauthorized

  schemas:
    ErrorMessage:
      type: object
      properties:
        error:
          type: string

    SchedulerError:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string
          description: |
            Missing required fields, Missing events, Too many events (max 20),
            or similar.

    VapiToolResults:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [toolCallId, result]
            properties:
              toolCallId:
                type: string
                description: From message.toolCalls[0].id, else "1"
              result:
                description: user_message or error string from the scheduler
                type: string

    EventsDirectResponse:
      type: object
      properties:
        success:
          type: boolean
        user_message:
          type: string
        items:
          type: array
          items:
            type: object
        error:
          type: string

    VapiSchedulerRequest:
      type: object
      description: |
        Union of Vapi envelope and flat fields. `_parse_vapi_request`
        reads message.toolCalls[0].function.arguments (object or JSON string).
        `_field` then falls back to the root body. Batch lists:
        events / appointments / items (max 20). Event date aliases:
        appointment_time, start, datetime, dateTime, date+start_time;
        new_appointment_time, new_start, to; current_appointment_time,
        from, original_start; duration from start/end if omitted.
      additionalProperties: true
      properties:
        message:
          $ref: "#/components/schemas/VapiToolCallMessage"
        business_code:
          type: string
        client_phone:
          type: string
        client_name:
          type: string
        service_id:
          type: integer
        duration:
          type: integer
        price:
          type: integer
        appointment_time:
          type: string
          description: ISO 8601 YYYY-MM-DDTHH:mm:ss (Asia/Jerusalem naive after parse)
        force_booking:
          type: boolean
        current_appointment_time:
          type: string
        new_appointment_time:
          type: string
        appointment_date:
          type: string
          description: YYYY-MM-DD filter for list
        date:
          type: string
          description: YYYY-MM-DD for slots / reschedule-suggest
        action:
          type: string
          description: Default action for /events or per-item
        events:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: true
        appointments:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: true
        items:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: true

    VapiToolCallMessage:
      type: object
      properties:
        toolCalls:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              function:
                type: object
                properties:
                  name:
                    type: string
                  arguments:
                    description: Object or JSON string of tool arguments
                    oneOf:
                      - type: object
                        additionalProperties: true
                      - type: string

    VapiServerMessage:
      type: object
      additionalProperties: true
      properties:
        message:
          type: object
          additionalProperties: true
          properties:
            type:
              type: string
              description: assistant-request, end-of-call-report, or other (ignored)
            toolCalls:
              type: array
              items:
                type: object
            call:
              type: object
              properties:
                customer:
                  type: object
                  properties:
                    number:
                      type: string
                      description: Customer phone; normalized via helper.normalize_phone

    VapiInitProbe:
      type: object
      required: [status, endpoint]
      properties:
        status:
          type: string
          enum: [ok]
        endpoint:
          type: string
          enum: [vapi-init]

    VapiIgnored:
      type: object
      properties:
        status:
          type: string
          enum: [ignored]
        reason:
          type: string
          enum: ["not an assistant-request"]

    VapiAssistantResponse:
      type: object
      description: Shape returned for assistant-request (fields from app.py)
      properties:
        assistantId:
          type: string
        assistantOverrides:
          type: object
          properties:
            firstMessage:
              type: string
            artifactPlan: {}
            serverMessages:
              type: array
              items:
                type: string
              example: [end-of-call-report]
            model:
              type: object
              properties:
                provider:
                  type: string
                model:
                  type: string
                temperature:
                  type: number
                tools:
                  type: array
                  description: Output of build_scheduler_tools (book/slots/cancel/reschedule/appointments)
                  items:
                    type: object
            variableValues:
              type: object
              additionalProperties: true
              properties:
                callerFound:
                  type: string
                firstName:
                  type: string
                fullName:
                  type: string
                callerNumber:
                  type: string
                gender:
                  type: string
                id:
                  type: string
                email:
                  type: string
                today_date:
                  type: string
                today_spoken:
                  type: string
                currentDay:
                  type: string
                currentTime:
                  type: string
                currentTimeSpoken:
                  type: string
                speech_style:
                  type: string
                services_list:
                  type: string

    MetaWhatsAppWebhook:
      type: object
      description: Meta Cloud API webhook; first parseable text/interactive/button message is used
      additionalProperties: true
      properties:
        entry:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              changes:
                type: array
                items:
                  type: object
                  properties:
                    value:
                      type: object
                      properties:
                        messages:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              from:
                                type: string
                              type:
                                type: string
                                enum: [text, interactive, button]
                              text:
                                type: object
                                properties:
                                  body:
                                    type: string
                              interactive:
                                type: object
                              button:
                                type: object

    GreenApiWhatsAppWebhook:
      type: object
      description: Parsed only when typeWebhook is incomingMessageReceived; group chats @g.us ignored
      additionalProperties: true
      properties:
        typeWebhook:
          type: string
          enum: [incomingMessageReceived]
        idMessage:
          type: string
        senderData:
          type: object
          properties:
            chatId:
              type: string
            sender:
              type: string
        messageData:
          type: object
          additionalProperties: true
          properties:
            typeMessage:
              type: string

    WhatsAppPostOk:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
        ignored:
          type: boolean

    ConversationsPurgeResult:
      type: object
      required: [ok, detail, recording, metrics, held]
      properties:
        ok:
          type: boolean
          enum: [true]
        detail:
          type: integer
          description: Rows with transcript/summary/tool_calls nulled
        recording:
          type: integer
          description: Rows with recording fields nulled
        metrics:
          type: integer
          description: conversation_logs rows deleted
        held:
          type: integer
          description: Businesses skipped because legal_hold is set

    BillingHealth:
      type: object
      additionalProperties: false
      required:
        - ok
        - terminal_configured
        - user_configured
        - mid_configured
        - password_configured
        - link_secret_configured
        - relay_host
      properties:
        ok:
          type: boolean
          description: True iff user, password, terminal, and mid are all set
        terminal_configured:
          type: boolean
        user_configured:
          type: boolean
        mid_configured:
          type: boolean
        password_configured:
          type: boolean
          description: Boolean only; password value is never returned
        link_secret_configured:
          type: boolean
          description: BILLING_LINK_SECRET or VAPI_SECRET is non-empty
        relay_host:
          type: string
          description: Hostname from CREDITGUARD_RELAY_URL
