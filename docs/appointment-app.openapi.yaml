      responses:
        "200":
          description: Probe JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapiInitProbe"
    options:
      tags: [Vapi]
      operationId: vapiInitPrefixedOptions
      summary: Alias of OPTIONS /vapi-init
      responses:
        "200":
          description: Empty body
    head:
      tags: [Vapi]
      operationId: vapiInitPrefixedHead
      summary: Alias of HEAD /vapi-init
      responses:
        "200":
          description: Same as GET
    post:
      tags: [Vapi]
      operationId: vapiInitPrefixedPost
      summary: Alias of POST /vapi-init
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VapiServerMessage"
      responses:
        "200":
          description: Same as POST /vapi-init
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: end-of-call-report persist failed
    put:
      tags: [Vapi]
      operationId: vapiInitPrefixedPut
      summary: Alias of PUT /vapi-init
      responses:
        "200":
          description: Same as POST /vapi-init
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Vapi]
      operationId: vapiInitPrefixedPatch
      summary: Alias of PATCH /vapi-init
      responses:
        "200":
          description: Same as POST /vapi-init
        "401":
          $ref: "#/components/responses/Unauthorized"

  /{prefix}/vapi-init/{rest}:
    parameters:
      - name: prefix
